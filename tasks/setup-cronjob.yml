---
# task file for freebsd-setup-mtree
# ------------------------------------------------------------
# Run mtree integrity check every for the specified period of time.
#
# /etc/crontab uses:
# minute hour day month weekday user command
# ------------------------------------------------------------

- name: Configure mtree integrity cron job
  regexp: >-
        ^{{ freebsd_security_mtree_cron_minute | regex_escape }}
        \* \* \* \* root
        {{ freebsd_security_mtree_script | regex_escape }}$
      line: >-
        {{ freebsd_security_mtree_cron_minute }}
        * * * * root
        {{ freebsd_security_mtree_script }}
      insertafter: EOF
      owner: root
      group: wheel
      mode: "0644"
      state: present
      ansible.builtin.lineinfile:
        path: /etc/crontab
