---
# task file for freebsd-setup-mtree
# ------------------------------------------------------------
# Run mtree integrity check every for the specified period of time.
#
# /etc/crontab uses:
# minute hour day month weekday user command
# ------------------------------------------------------------

- name: Configure mtree integrity cron job
  ansible.builtin.cron:
    cron_file: validate_mtree
    name: mtree_validation
    user: root
    job: "{{ freebsd_setup_mtree_script_check }}"
    minute: "{{ freebsd_setup_mtree_cron_minute }}"
    hour: "{{ freebsd_setup_mtree_cron_hour }}"
    day: "{{ freebsd_setup_mtree_cron_day }}"
    month: "{{ freebsd_setup_mtree_cron_month }}"
    weekday: "{{ freebsd_setup_mtree_cron_day_of_week }}"
